<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aafiyah's World</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wrapper">
      <header>
        <div class="brand">
          <div class="brand-mark"></div>
          <h1>Aafiyah's World</h1>
        </div>

        <div class="top-links">
          <a class="link-button" href="games/index.html">Games</a>
          <a class="link-button" href="games/README.md">Concept</a>
        </div>
      </header>

      <main class="layout">
        <section class="game-panel">
          <div id="stage" class="stage" aria-label="Playable game stage">
            <div class="sun"></div>
            <div id="creature" class="creature" aria-live="polite">
              <div class="body">
                <div class="smile"></div>
              </div>
              <div class="head">
                <div class="mouth"></div>
              </div>
            </div>
            <div class="grass"></div>
          </div>

          <div class="status-bar">
            <div class="metrics">
              <div class="metric">
                <span class="metric-label">Letters</span>
                <span id="lettersCollected" class="metric-value">0</span>
              </div>
              <div class="metric">
                <span class="metric-label">Words</span>
                <span id="wordsMade" class="metric-value">0</span>
              </div>
              <div class="metric">
                <span class="metric-label">Evolution</span>
                <span id="evolution" class="metric-value">Companion</span>
              </div>
            </div>

            <div class="controls">
              <button id="startGame" class="primary">Start Game</button>
              <button id="collectLetter" class="secondary">Eat Letter</button>
            </div>
          </div>
        </section>

        <aside class="side-panel">
          <div class="sidebar-section">
            <h2>Word Form</h2>
            <div class="word-box">
              <div id="wordDisplay" class="word-display">—</div>
            </div>
          </div>

          <div class="sidebar-section">
            <h2>Beat Maker</h2>
            <div class="beat-box">
              <div class="beat-pad-grid">
                <button class="beat-pad" data-sound="Kick">Kick</button>
                <button class="beat-pad" data-sound="Snare">Snare</button>
                <button class="beat-pad" data-sound="Hi-Hat">Hi-Hat</button>
                <button class="beat-pad" data-sound="Bass">Bass</button>
              </div>

              <div class="recording">
                <button id="recordBtn" class="secondary">Record Voice</button>
                <span id="recordDot" class="dot"></span>
              </div>
            </div>
          </div>

          <div class="status" id="statusText">Collect letters to grow your companion.</div>
        </aside>
      </main>
    </div>

    <script src="game.js"></script>
  </body>
</html>
